# Fall AI configuration
# Delete the placeholder comments and add your RTSP cameras.

cameras:
  # - id: phong_khach
  #   name: "Phòng khách"
  #   rtsp: "rtsp://USER:PASSWORD@192.168.0.100:554/..."
  #   enabled: true

  # - id: san
  #   name: "Sân"
  #   rtsp: "rtsp://USER:PASSWORD@192.168.0.101:554/..."
  #   enabled: true

global:
  # Bắt đầu thấp để bảo vệ i5-8250U
  inference_fps: 3
  alert_fps: 5
  image_size: 416
  person_confidence: 0.45

  # Motion gate nội bộ của addon
  motion_threshold: 8.0
  motion_pixels: 250

  # Xác nhận ngã
  confirmation_seconds: 8
  cooldown_seconds: 60
  fall_score_threshold: 0.72

  # CPU
  cpu_threads: 2

  snapshot_on_event: true
  max_people: 2
  track_timeout_seconds: 1.5
  mqtt_prefix: fall_ai
