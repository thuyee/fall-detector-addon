# Fall AI camera configuration
# Copy/edit this file as /addon_configs/<repo>_fall_ai/fall_config.yaml

home_assistant:
  # The add-on gets the token automatically from Supervisor.
  # Do not put a long-lived HA token here.
  event_name: fall_ai_event

global:
  model: yolo11n-pose.pt
  inference_fps: 3
  confirmation_seconds: 2.5
  cooldown_seconds: 60
  person_confidence: 0.45
  fall_score_threshold: 0.72
  cpu_threads: 2
  frame_width: 640
  frame_height: 360
  post_motion_seconds: 10
  max_people: 2
  save_snapshot: true

cameras:
  - id: phong_khach
    name: C6N Phòng Khách
    enabled: true
    rtsp: "rtsp://USER:PASSWORD@CAMERA_IP:554/STREAM"
    motion_entity: "binary_sensor.THAY_ENTITY_MOTION_C6N"

  - id: san
    name: H6C Sân
    enabled: true
    rtsp: "rtsp://USER:PASSWORD@CAMERA_IP:554/STREAM"
    motion_entity: "binary_sensor.THAY_ENTITY_MOTION_H6C"

# Add more cameras by copying a camera block.
