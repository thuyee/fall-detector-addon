name: Fall AI
version: "0.2.0"
slug: fall_ai
description: CPU-efficient YOLO11n pose fall detection with mobile/Zalo alerts for Home Assistant
arch:
  - amd64
startup: application
boot: auto
init: false
hassio_api: true
homeassistant_api: true
map:
  - addon_config:rw
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "Snapshot image server used to attach photos to mobile/Zalo notifications"
options:
  log_level: info
schema:
  log_level: list(debug|info|warning|error)
stage: experimental
panel_icon: mdi:human-falling
